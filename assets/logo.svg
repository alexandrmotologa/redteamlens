<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Optical Lens Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="110" fill="#0c1322" stroke="#334155" stroke-width="2"/>

  <!-- Targeting Reticle Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="100" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="456" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="100" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Shield & Aperture -->
  <g filter="url(#glow)">
    <!-- Protective Shield Emblem -->
    <path d="M256 140 L340 180 V260 C340 315 304 360 256 376 C208 360 172 315 172 260 V180 Z"
          fill="url(#shieldGrad)"
          stroke="#ffffff"
          stroke-width="3"
          stroke-opacity="0.3"/>

    <!-- Inner Core Lens Aperture -->
    <circle cx="256" cy="250" r="46" fill="#030712" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="256" cy="250" r="22" fill="#ef4444"/>

    <!-- Pulse Ring -->
    <circle cx="256" cy="250" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Accent Nodes -->
  <circle cx="256" cy="140" r="5" fill="#f87171"/>
  <circle cx="340" cy="180" r="5" fill="#f43f5e"/>
  <circle cx="172" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="256" cy="376" r="5" fill="#a855f7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="ruby-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e4d"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="ruby-grad-rev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="reticle-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Reticle Calibration Boundary -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#dc2626" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- Targeting Coordinate Marks -->
      <line x1="0" y1="-375" x2="0" y2="-335" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="335" x2="0" y2="375" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="-320" y1="0" x2="-280" y2="0" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="280" y1="0" x2="320" y2="0" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

      <!-- Symmetrical Origami Mascot: Red Raptor (Adversarial Precision Strike & Lens Optics) -->

      <!-- 1. Watertight Solid Base Silhouette (Zero-Leak) -->
      <path d="
        M 0 -290
        L 75 -245
        L 135 -265
        L 120 -185
        L 215 -110
        L 185 -30
        L 245 80
        L 190 205
        L 135 295
        L 0 350
        L -135 295
        L -190 205
        L -245 80
        L -185 -30
        L -215 -110
        L -120 -185
        L -135 -265
        L -75 -245
        Z
      " fill="#0f172a" />

      <!-- 2. Crown Crest Feathers & Dorsal Ridge -->
      <polygon points="0,-290 45,-220 0,-185" fill="#334155" />
      <polygon points="0,-290 -45,-220 0,-185" fill="#1e293b" />

      <polygon points="0,-290 75,-245 45,-220" fill="#475569" />
      <polygon points="0,-290 -75,-245 -45,-220" fill="#0f172a" />

      <polygon points="75,-245 135,-265 105,-205" fill="#dc2626" />
      <polygon points="-75,-245 -135,-265 -105,-205" fill="#991b1b" />

      <!-- 3. Forehead & Temples -->
      <polygon points="45,-220 105,-205 70,-155" fill="#334155" />
      <polygon points="-45,-220 -105,-205 -70,-155" fill="#1e293b" />

      <polygon points="0,-185 45,-220 70,-155 0,-130" fill="#475569" />
      <polygon points="0,-185 -45,-220 -70,-155 0,-130" fill="#1e293b" />

      <!-- 4. Ear Tufts & Supraorbital Armor Brows -->
      <polygon points="105,-205 120,-185 70,-155" fill="#64748b" />
      <polygon points="-105,-205 -120,-185 -70,-155" fill="#0f172a" />

      <polygon points="70,-155 120,-185 145,-130 85,-115" fill="#ef4444" />
      <polygon points="-70,-155 -120,-185 -145,-130 -85,-115" fill="#b91c1c" />

      <!-- 5. Predatory Optical Eyes (Electric Targeting Cant) -->
      <!-- Right Eye Socket & Lens -->
      <polygon points="35,-140 80,-145 85,-115 45,-115" fill="#0f172a" />
      <polygon points="42,-136 75,-140 78,-120 48,-118" fill="url(#ruby-grad)" />
      <polygon points="56,-133 66,-135 68,-124 58,-123" fill="#ffffff" />

      <!-- Left Eye Socket & Lens -->
      <polygon points="-35,-140 -80,-145 -85,-115 -45,-115" fill="#020617" />
      <polygon points="-42,-136 -75,-140 -78,-120 -48,-118" fill="url(#ruby-grad-rev)" />
      <polygon points="-56,-133 -66,-135 -68,-124 -58,-123" fill="#ffffff" />

      <!-- 6. Sharp Hooked Raptor Beak (Aerodynamic Apex) -->
      <polygon points="0,-130 30,-115 0,-45" fill="#f59e0b" />
      <polygon points="0,-130 -30,-115 0,-45" fill="#d97706" />

      <polygon points="0,-45 28,-75 0,-95" fill="#fbbf24" />
      <polygon points="0,-45 -28,-75 0,-95" fill="#b45309" />

      <!-- Hooked Tomium Tip -->
      <polygon points="0,-45 15,-40 0,-15" fill="#b45309" />
      <polygon points="0,-45 -15,-40 0,-15" fill="#78350f" />

      <!-- 7. Aerodynamic Cheek Facets & Malar Plates -->
      <polygon points="85,-115 145,-130 175,-70 115,-55" fill="#334155" />
      <polygon points="-85,-115 -145,-130 -175,-70 -115,-55" fill="#1e293b" />

      <polygon points="115,-55 175,-70 215,-110 185,-30 140,-15" fill="#475569" />
      <polygon points="-115,-55 -175,-70 -215,-110 -185,-30 -140,-15" fill="#0f172a" />

      <polygon points="30,-115 85,-115 115,-55 35,-45" fill="#dc2626" />
      <polygon points="-30,-115 -85,-115 -115,-55 -35,-45" fill="#991b1b" />

      <!-- 8. Throat & Gorget Plates -->
      <polygon points="0,-15 35,-45 45,35 0,60" fill="#334155" />
      <polygon points="0,-15 -35,-45 -45,35 0,60" fill="#1e293b" />

      <polygon points="35,-45 115,-55 140,-15 95,45 45,35" fill="#64748b" />
      <polygon points="-35,-45 -115,-55 -140,-15 -95,45 -45,35" fill="#0f172a" />

      <!-- 9. Mantle & Tactical Wing Armor -->
      <polygon points="140,-15 185,-30 245,80 175,95 95,45" fill="#1e293b" />
      <polygon points="-140,-15 -185,-30 -245,80 -175,95 -95,45" fill="#0a0f1d" />

      <polygon points="175,95 245,80 190,205 130,175" fill="#334155" />
      <polygon points="-175,95 -245,80 -190,205 -130,175" fill="#0f172a" />

      <polygon points="130,175 190,205 135,295 85,250" fill="#475569" />
      <polygon points="-130,175 -190,205 -135,295 -85,250" fill="#1e293b" />

      <!-- 10. Central Optical Targeting Core (The RedTeam "Lens") -->
      <!-- Hexagonal Optical Housing -->
      <polygon points="
        0,65
        75,108
        75,195
        0,238
        -75,195
        -75,108
      " fill="#0f172a" stroke="#dc2626" stroke-width="6" stroke-linejoin="round" />

      <!-- Reticle Ring -->
      <circle cx="0" cy="151" r="50" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8, 6" />

      <!-- Inner Ruby Sensor -->
      <circle cx="0" cy="151" r="32" fill="url(#ruby-grad)" />

      <!-- Cyan Crosshair Stigmas -->
      <line x1="0" y1="115" x2="0" y2="135" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="167" x2="0" y2="187" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
      <line x1="-36" y1="151" x2="-16" y2="151" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="151" x2="36" y2="151" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />

      <!-- Center Laser Focal Point -->
      <circle cx="0" cy="151" r="7" fill="#ffffff" />

      <!-- 11. Ventral Prow & Lower Keel Plates -->
      <polygon points="0,238 75,195 85,250 0,350" fill="#dc2626" />
      <polygon points="0,238 -75,195 -85,250 0,350" fill="#991b1b" />

      <polygon points="85,250 135,295 0,350" fill="#334155" />
      <polygon points="-85,250 -135,295 0,350" fill="#1e293b" />
    </g>
  </g>
</svg>
